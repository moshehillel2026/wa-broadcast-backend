services:
  # ─── Express API Server ──────────────────────────────────────────────────
  - type: web
    name: wa-broadcast-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: REDIS_URL
        fromService:
          type: redis
          name: wa-redis
          property: connectionString
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_WABA_ID
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WP_JWT_SECRET
        sync: false
      - key: WP_SITE_URL
        sync: false
      - key: META_API_VERSION
        value: v19.0

  # ─── BullMQ Background Worker ─────────────────────────────────────────────
  - type: worker
    name: wa-broadcast-worker
    env: node
    buildCommand: npm install
    startCommand: node src/workers/broadcastWorker.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: wa-redis
          property: connectionString
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_WABA_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WP_JWT_SECRET
        sync: false
      - key: WP_SITE_URL
        sync: false
      - key: META_API_VERSION
        value: v19.0
      - key: WORKER_CONCURRENCY
        value: 5

  # ─── Webhook Worker ────────────────────────────────────────────────────────
  - type: worker
    name: wa-webhook-worker
    env: node
    buildCommand: npm install
    startCommand: node src/workers/webhookWorker.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: wa-redis
          property: connectionString
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: WP_JWT_SECRET
        sync: false
      - key: WP_SITE_URL
        sync: false

  # ─── Redis Key Value Instance ─────────────────────────────────────────────────
  - type: redis
    name: wa-redis
    maxmemoryPolicy: noeviction
    plan: free
